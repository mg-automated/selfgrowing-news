name: Deploy Quartz site to GitHub Pages

# Deploy automatically when a daily note changes on main. Manual runs remain
# available for testing and recovery.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "News/Daily/**/*.md"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out archive
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-quartz-${{ hashFiles('site/build.sh', 'site/quartz.config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-quartz-

      - name: Build Quartz site
        run: bash site/build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.quartz-runtime/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
